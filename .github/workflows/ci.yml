name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build HostDeck.slnx -c Release
      - name: Test
        run: dotnet test --solution HostDeck.slnx -c Release --no-build
      - name: Publish (self-contained, win-x64)
        run: dotnet publish src/HostDeck.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: HostDeck-win-x64
          path: publish/
